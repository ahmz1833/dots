# ╔════════════════════════════════════════════════════════════════════════════╗
# ║                                                                            ║
# ║                     TMUX CONFIGURATION (Plugin-Free)                       ║
# ║                          One Monokai Theme                                 ║
# ║                                                                            ║
# ╚════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# SENSIBLE DEFAULTS
# ══════════════════════════════════════════════════════════════════════════════

# Prefix key: Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Address vim mode switching delay
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 50000

# Display messages longer
set -g display-time 2000
set -g display-panes-time 2000

# Focus events for vim/neovim
set -g focus-events on

# Aggressive resize (useful for grouped sessions)
setw -g aggressive-resize on

# Start indexing at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one closes
set -g renumber-windows on

# Don't detach on session destroy, switch to other session
set -g detach-on-destroy off

# Word separators for double-click selection
set -g word-separators ' @"=()[]'
set -ag word-separators "'"

# Mouse support
set -g mouse on

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# ══════════════════════════════════════════════════════════════════════════════
# TERMINAL & CLIPBOARD (OSC52 Support)
# ══════════════════════════════════════════════════════════════════════════════

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*256col*:RGB"

# OSC52 support
set -g set-clipboard on
set -g allow-passthrough on

# Fallback for older tmux / different terminals
set -ga terminal-overrides ',*:allow-passthrough:on'

# Allow OSC52 to pass through tmux to terminal
set -ag terminal-overrides ",*:Ms=\E]52;c;%p2%s\a"

# Allow tmux to set terminal title
set -g set-titles on
set -g set-titles-string "#S / #W / #T"

# ══════════════════════════════════════════════════════════════════════════════
# KEY BINDINGS
# ══════════════════════════════════════════════════════════════════════════════

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Pane splitting
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r C-h resize-pane -L 1
bind -r C-j resize-pane -D 1
bind -r C-k resize-pane -U 1
bind -r C-l resize-pane -R 1

# Window navigation
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind n next-window
bind p previous-window
bind Tab last-window

# Window management
bind c new-window -c "#{pane_current_path}"
bind C new-window
bind t new-window -c "#{pane_current_path}"
bind w confirm-before -p "Kill window? (y/n)" kill-window
bind , command-prompt -I "#W" "rename-window '%%'"

# Session management
bind S command-prompt -p "New session:" "new-session -s '%%'"
bind s choose-tree -sZ -O name
bind Q confirm-before -p "Kill session #S? (y/n)" kill-session
bind $ command-prompt -I "#S" "rename-session '%%'"
bind d detach-client

# Copy mode (vim-style)
setw -g mode-keys vi
bind Enter copy-mode
bind [ copy-mode
bind v copy-mode

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Default copy bindings (via script for Local + OSC52 over SSH)
bind -T copy-mode-vi y send-keys -X copy-pipe-no-clear "~/dots/scripts/xcliper" \; send-keys -X clear-selection
bind -T copy-mode-vi C-c send-keys -X copy-pipe-no-clear "~/dots/scripts/xcliper" \; send-keys -X clear-selection
bind -T copy-mode-vi Enter send-keys -X copy-pipe-no-clear "~/dots/scripts/xcliper" \; send-keys -X clear-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line

# Search
bind / copy-mode \; send-keys ?
bind ? list-keys

# Pane management
bind x kill-pane
bind X kill-window
bind z resize-pane -Z
bind Space next-layout
bind = select-layout even-horizontal
bind + select-layout even-vertical
bind > swap-pane -D
bind < swap-pane -U
bind b break-pane
bind @ command-prompt -p "Join pane from:" "join-pane -s '%%'"
bind Y setw synchronize-panes \; display "Sync #{?pane_synchronized,ON,OFF}"

# Quick actions
bind C-l send-keys 'C-l' \; clear-history
bind e new-window -n "tmux.conf" "vim ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display 'Reloaded'"
bind E new-window -n "tmux.local" "vim ~/.tmux.local.conf && tmux source ~/.tmux.conf && tmux display 'Reloaded'"

# Popup terminal (tmux 3.2+)
bind ` if-shell -F '#{==:#{session_name},popup}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 75% -E 'tmux attach -t popup || tmux new -s popup'
}

# Mouse: click session name to toggle picker
bind -n MouseDown1StatusLeft if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys Escape' 'choose-tree -sZ -O name'
bind -n DoubleClick1Status new-window -c "#{pane_current_path}"
# ══════════════════════════════════════════════════════════════════════════════
# STATUSLINE VARIABLES
# ══════════════════════════════════════════════════════════════════════════════

# User-facing knobs. Override these from ~/.tmux.local.conf.
set -gq @theme_name "monokai"
set -gq @status_preset "minimal"
set -gq @status_position "bottom"
set -gq @full_architecture "conic"
set -gq @show_session "on"
set -gq @show_host "on"
set -gq @show_prefix_indicator "on"
set -gq @show_usage "off"
set -gq @show_netspeed "off"
set -gq @show_date "off"
set -gq @show_seconds "on"

# Palette defaults (fallback if a theme file is missing).
set -gq @thm_bg "#282c34"
set -gq @thm_fg "#abb2bf"
set -gq @thm_muted "#5c6370"
set -gq @thm_surface "#1e2127"
set -gq @thm_session "#c678dd"
set -gq @thm_window "#4b5263"
set -gq @thm_active "#61afef"
set -gq @thm_usage "#56b6c2"
set -gq @thm_netspeed "#e06c75"
set -gq @thm_host "#98c379"
set -gq @thm_time "#e5c07b"
set -gq @thm_alert "#d19a66"
set -gq @thm_message "#e5c07b"
set -gq @thm_clock "#61afef"
set -gq @thm_border "#5c6370"

# ══════════════════════════════════════════════════════════════════════════════
# LOCAL CONFIG (variables only)
# ══════════════════════════════════════════════════════════════════════════════

if-shell "[ -f ~/.tmux.local.conf ]" {
    source-file ~/.tmux.local.conf
}

# ══════════════════════════════════════════════════════════════════════════════
# DYNAMIC STATUS INTERVAL
# ══════════════════════════════════════════════════════════════════════════════

if-shell -F '#{==:#{@show_seconds},on}' {
    set -g status-interval 1
} {
    set -g status-interval 5
}

# ══════════════════════════════════════════════════════════════════════════════
# STATUSLINE / POWERLINE BUILDER
# ══════════════════════════════════════════════════════════════════════════════

set -g status on
set -g status-justify left
set -g status-style "fg=#{@thm_fg},bg=#{@thm_bg}"
set -g status-left-length 80
set -g status-right-length 160

if-shell -F '#{==:#{@status_position},top}' 'set -g status-position top' 'set -g status-position bottom'

set -g pane-border-style "fg=#{@thm_border}"
set -g pane-active-border-style "fg=#{@thm_active}"
set -g message-style "fg=#{@thm_surface},bg=#{@thm_message},bold"
set -g message-command-style "fg=#{@thm_message},bg=#{@thm_surface}"
set -g mode-style "fg=#{@thm_surface},bg=#{@thm_message}"
setw -g clock-mode-style 24
run-shell -b 'tmux setw -g clock-mode-colour "$(tmux show-options -gqv @thm_clock)"'

set -gq @segment_prefix ''
set -gq @segment_usage ''
set -gq @segment_netspeed ''
set -gq @segment_host ''
set -gq @segment_time ''
set -gq @segment_session ''
set -gq @classic_segment_prefix ''
set -gq @classic_segment_usage ''
set -gq @classic_segment_netspeed ''
set -gq @classic_segment_host ''
set -gq @live_prefix_classic ''
set -gq @live_prefix_minimal ''
set -gq @live_prefix_full ''
set -gq @full_segment_netspeed ''
set -gq @full_segment_usage ''
set -gq @full_segment_host ''
set -gq @full_segment_time ''
set -gq @full_status_left ''
set -gq @full_window_format ''
set -gq @full_window_current_format ''
set -gq @segment_time_text '%H:%M'
set -gq @classic_time_text '%H:%M'

if-shell -F '#{==:#{@show_seconds},on}' {
  set -gq @segment_time_text '%H:%M:%S'
  set -gq @classic_time_text '%H:%M:%S'
}

if-shell -F '#{==:#{@show_date},on}' {
  if-shell -F '#{==:#{@show_seconds},on}' {
    set -gq @segment_time_text '%a %d-%b %H:%M:%S'
    set -gq @classic_time_text '%a %d-%b %H:%M:%S'
  } {
    set -gq @segment_time_text '%a %d-%b %H:%M'
    set -gq @classic_time_text '%a %d-%b %H:%M'
  }
}

if-shell -F '#{==:#{@show_prefix_indicator},on}' \
  'set -gq @segment_prefix "#[fg=#{@thm_surface},bg=#{@thm_alert},bold] 󰘳 PREFIX #[default]"'

if-shell -F '#{==:#{@show_prefix_indicator},on}' \
  'set -gq @live_prefix_classic "#[fg=#{@thm_surface},bg=#{@thm_alert},bold]#{?client_prefix, PREFIX ,}#[default]"'

if-shell -F '#{==:#{@show_prefix_indicator},on}' \
  'set -gq @live_prefix_minimal "#[fg=#{@thm_surface},bg=#{@thm_alert},bold]#{?client_prefix, 󰘳 PREFIX ,}#[default]"'

if-shell -F '#{==:#{@show_usage},on}' \
  'set -gq @segment_usage "#[fg=#{@thm_surface},bg=#{@thm_usage}] #(~/.local/bin/checkusage -nocolor) #[default]"'

if-shell -F '#{==:#{@show_usage},on}' \
  'set -gq @classic_segment_usage "#[fg=#{@thm_fg},bg=#{@thm_bg}] #(~/.local/bin/checkusage -nocolor) "'

if-shell -F '#{==:#{@show_netspeed},on}' \
  'set -gq @segment_netspeed "#[fg=#{@thm_surface},bg=#{@thm_netspeed}] 󰖩 #(~/.local/bin/netspd) #[default]"'

if-shell -F '#{==:#{@show_netspeed},on}' \
  'set -gq @classic_segment_netspeed "#[fg=#{@thm_fg},bg=#{@thm_bg}] #(~/.local/bin/netspd) "'

if-shell -F '#{==:#{@show_host},on}' \
  'set -gq @segment_host "#[fg=#{@thm_surface},bg=#{@thm_host},bold] 󰒋 #H #[default]"'

if-shell -F '#{==:#{@show_host},on}' \
  'set -gq @classic_segment_host "#[fg=#{@thm_fg},bg=#{@thm_bg},bold] #H "'

if-shell -F '#{==:#{@show_date},on}' {
  if-shell -F '#{==:#{@show_seconds},on}' \
    'set -gq @segment_time "#[fg=#{@thm_surface},bg=#{@thm_time},bold] %a %d-%b %H:%M:%S "'
} {
  if-shell -F '#{==:#{@show_seconds},on}' \
    'set -gq @segment_time "#[fg=#{@thm_surface},bg=#{@thm_time},bold] %H:%M:%S "'
}

if-shell -F '#{==:#{@show_date},on}' {
  if-shell -F '#{!=:#{@show_seconds},on}' \
    'set -gq @segment_time "#[fg=#{@thm_surface},bg=#{@thm_time},bold] %a %d-%b %H:%M "'
} {
  if-shell -F '#{!=:#{@show_seconds},on}' \
    'set -gq @segment_time "#[fg=#{@thm_surface},bg=#{@thm_time},bold] %H:%M "'
}

if-shell -F '#{==:#{@show_session},on}' \
  'set -gq @segment_session "#[fg=#{@thm_surface},bg=#{@thm_session},bold] 󱂬 #S "'

if-shell -F '#{==:#{@full_architecture},round}' {
  # Right
  if-shell -F '#{==:#{@show_prefix_indicator},on}' \
    'set -gq @live_prefix_full "#[fg=#{@thm_alert},bg=#{@thm_bg}]#{?client_prefix,,}#[fg=#{@thm_surface},bg=#{@thm_alert},bold]#{?client_prefix, 󰘳 PREFIX ,}#[fg=#{@thm_alert},bg=#{@thm_bg}]#{?client_prefix, ,}#[default]"'
  if-shell -F '#{==:#{@show_netspeed},on}' \
    'set -gq @full_segment_netspeed "#[fg=#{@thm_netspeed},bg=#{@thm_bg}]#[fg=#{@thm_surface},bg=#{@thm_netspeed}] 󰖩 #(~/.local/bin/netspd) #[fg=#{@thm_netspeed},bg=#{@thm_bg}]#[default] "'
  if-shell -F '#{==:#{@show_usage},on}' \
    'set -gq @full_segment_usage "#[fg=#{@thm_usage},bg=#{@thm_bg}]#[fg=#{@thm_surface},bg=#{@thm_usage}] #(~/.local/bin/checkusage -nocolor) #[fg=#{@thm_usage},bg=#{@thm_bg}]#[default] "'
  if-shell -F '#{==:#{@show_host},on}' \
    'set -gq @full_segment_host "#[fg=#{@thm_host},bg=#{@thm_bg}]#[fg=#{@thm_surface},bg=#{@thm_host},bold] 󰒋 #H #[fg=#{@thm_host},bg=#{@thm_bg}]#[default] "'
  set -gq @full_segment_time "#[fg=#{@thm_time},bg=#{@thm_bg}]#{E:@segment_time}#[fg=#{@thm_time},bg=#{@thm_bg}]#[default]"
  # Left
  if-shell -F '#{==:#{@show_session},on}' \
    'set -gq @full_status_left "#[fg=#{@thm_session},bg=#{@thm_bg}]#[fg=#{@thm_surface},bg=#{@thm_session},bold] 󱂬 #S #[fg=#{@thm_session},bg=#{@thm_bg}]#[default] "'
  set -gq @full_window_format "#[fg=#{@thm_window},bg=#{@thm_bg}]#[fg=#{@thm_fg},bg=#{@thm_window}] 󰖯 #I #W #[fg=#{@thm_window},bg=#{@thm_bg}]"
  set -gq @full_window_current_format "#[fg=#{@thm_active},bg=#{@thm_bg}]#[fg=#{@thm_surface},bg=#{@thm_active},bold] 󰖲 #I #{?window_zoomed_flag,󰊓 ,}#W #[fg=#{@thm_active},bg=#{@thm_bg}]"
} {
  # Right
  set -gq @chain_bg "#{@thm_bg}"

  if-shell -F '#{==:#{@show_prefix_indicator},on}' {
    set -gqF @chain_bg_0 "#{E:@chain_bg}"
    set -gq @live_prefix_full "#[fg=#{@thm_alert},bg=#{E:@chain_bg_0}]#{?client_prefix,,}#[fg=#{@thm_surface},bg=#{@thm_alert},bold]#{?client_prefix, 󰘳 PREFIX ,}#[nobold]"
    set -gq @chain_bg_1 "#{?client_prefix,#{@thm_alert},#{E:@chain_bg_0}}"
  } {
    set -gq @chain_bg_1 "#{@chain_bg}"
  }

  if-shell -F '#{==:#{@show_netspeed},on}' {
    set -gq @full_segment_netspeed "#[fg=#{@thm_netspeed},bg=#{E:@chain_bg_1}]#[fg=#{@thm_surface},bg=#{@thm_netspeed}] 󰖩 #(~/.local/bin/netspd)#[nobold] "
    set -gq @chain_bg "#{@thm_netspeed}"
  }

  if-shell -F '#{==:#{@show_usage},on}' {
    set -gqF @chain_bg_2 "#{E:@chain_bg}"
    set -gq @full_segment_usage "#[fg=#{@thm_usage},bg=#{E:@chain_bg_2}]#[fg=#{@thm_surface},bg=#{@thm_usage}] #(~/.local/bin/checkusage -nocolor)#[nobold] "
    set -gq @chain_bg "#{@thm_usage}"
  }

  if-shell -F '#{==:#{@show_host},on}' {
    set -gqF @chain_bg_3 "#{E:@chain_bg}"
    set -gq @full_segment_host "#[fg=#{@thm_host},bg=#{E:@chain_bg_3}]#[fg=#{@thm_surface},bg=#{@thm_host},bold] 󰒋 #H#[nobold] "
    set -gq @chain_bg "#{@thm_host}"
  }

  set -gq @full_segment_time "#[fg=#{@thm_time},bg=#{E:@chain_bg}]#[fg=#{@thm_surface},bg=#{@thm_time},bold] #{E:@segment_time_text} #[nobold]"

  # Left
  if-shell -F '#{==:#{@show_session},on}' \
    'set -gq @full_status_left "#[fg=#{@thm_surface},bg=#{@thm_session},bold] 󱂬 #S #[fg=#{@thm_session},bg=#{@thm_bg}]#[default] "'
  set -gq @full_window_format "#[fg=#{@thm_fg},bg=#{@thm_window}] 󰖯 #I #{?window_last_flag, ,}#W #[fg=#{@thm_window},bg=#{@thm_bg}]#[default]"
  set -gq @full_window_current_format "#[fg=#{@thm_surface},bg=#{@thm_active},bold] 󰖲 #I #{?window_zoomed_flag,󰊓 ,}#W #[fg=#{@thm_active},bg=#{@thm_bg}]#[default]"
}

if-shell -F '#{==:#{@status_preset},classic}' {
    if-shell -F '#{==:#{@show_session},on}' \
      'set -g status-left "#[fg=#{@thm_fg},bg=#{@thm_bg},bold] [#S] #[default]"' \
      'set -g status-left ""'
    set -g window-status-separator " "
    set -g window-status-format "#[fg=#{@thm_fg},bg=#{@thm_bg}] #I:#W#F "
    set -g window-status-current-format "#[fg=#{@thm_surface},bg=#{@thm_active},bold] #I:#W#F #[default]"
    if-shell -F '#{==:#{@show_date},on}' {
        if-shell -F '#{==:#{@show_seconds},on}' \
          'set -g status-right "#{E:@live_prefix_classic}#{E:@classic_segment_netspeed}#{E:@classic_segment_usage}#{E:@classic_segment_host}#[fg=#{@thm_fg},bg=#{@thm_bg},bold] %a %d-%b %H:%M:%S "'
    } {
        if-shell -F '#{==:#{@show_seconds},on}' \
          'set -g status-right "#{E:@live_prefix_classic}#{E:@classic_segment_netspeed}#{E:@classic_segment_usage}#{E:@classic_segment_host}#[fg=#{@thm_fg},bg=#{@thm_bg},bold] %H:%M:%S "'
    }
    if-shell -F '#{==:#{@show_date},on}' {
        if-shell -F '#{!=:#{@show_seconds},on}' \
          'set -g status-right "#{E:@live_prefix_classic}#{E:@classic_segment_netspeed}#{E:@classic_segment_usage}#{E:@classic_segment_host}#[fg=#{@thm_fg},bg=#{@thm_bg},bold] %a %d-%b %H:%M "'
    } {
        if-shell -F '#{!=:#{@show_seconds},on}' \
          'set -g status-right "#{E:@live_prefix_classic}#{E:@classic_segment_netspeed}#{E:@classic_segment_usage}#{E:@classic_segment_host}#[fg=#{@thm_fg},bg=#{@thm_bg},bold] %H:%M "'
    }
} {
    if-shell -F '#{==:#{@status_preset},full}' {
        if-shell -F '#{==:#{@show_session},on}' \
          'set -g status-left "#{E:@full_status_left}"' \
          'set -g status-left ""'
        set -g window-status-separator ""
        set -g window-status-format "#{E:@full_window_format}"
        set -g window-status-current-format "#{E:@full_window_current_format}"
        set -g status-right "#{E:@live_prefix_full}#{E:@full_segment_netspeed}#{E:@full_segment_usage}#{E:@full_segment_host}#{E:@full_segment_time}"
    } {
        if-shell -F '#{==:#{@show_session},on}' \
          'set -g status-left "#[fg=#{@thm_surface},bg=#{@thm_session},bold] #S #[default] "' \
          'set -g status-left ""'
        set -g window-status-separator " "
        set -g window-status-format "#[fg=#{@thm_fg},bg=#{@thm_window}] #I:#W #[default]"
        set -g window-status-current-format "#[fg=#{@thm_surface},bg=#{@thm_active},bold] #I:#W#{?window_zoomed_flag, 󰊓,} #[default]"
        set -g status-right "#{E:@live_prefix_minimal}#{E:@segment_netspeed}#{E:@segment_usage}#{E:@segment_host}#{E:@segment_time}"
    }
}
