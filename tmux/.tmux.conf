# ╔════════════════════════════════════════════════════════════════════════════╗
# ║                                                                            ║
# ║                        TMUX CONFIGURATION                                  ║
# ║                        One Monokai Theme                                   ║
# ║                                                                            ║
# ╚════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# CORE SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

# Prefix key: Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Terminal settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g buffer-limit 20
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
set -sg escape-time 0

# Start indexing at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Mouse support
set -g mouse on

# Focus events (for vim)
set -g focus-events on

# Aggressive resize (useful when switching clients)
setw -g aggressive-resize on

# ══════════════════════════════════════════════════════════════════════════════
# KEY BINDINGS
# ══════════════════════════════════════════════════════════════════════════════

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ─────────────────────────────────────────────────────────────────────────────
# Pane splitting (more intuitive)
# ─────────────────────────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ─────────────────────────────────────────────────────────────────────────────
# Vim-style pane navigation
# ─────────────────────────────────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + hjkl (without prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ─────────────────────────────────────────────────────────────────────────────
# Pane resizing
# ─────────────────────────────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Fine-grained resizing
bind -r C-h resize-pane -L 1
bind -r C-j resize-pane -D 1
bind -r C-k resize-pane -U 1
bind -r C-l resize-pane -R 1

# ─────────────────────────────────────────────────────────────────────────────
# Window navigation
# ─────────────────────────────────────────────────────────────────────────────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Previous/Next window
bind -n M-p previous-window
bind -n M-n next-window

# New window in current path
bind c new-window -c "#{pane_current_path}"

# ─────────────────────────────────────────────────────────────────────────────
# Session management
# ─────────────────────────────────────────────────────────────────────────────
bind S command-prompt -p "New session name:" "new-session -s '%%'"
bind s choose-tree -sZ
bind Q confirm-before -p "Kill session #S? (y/n)" kill-session

# ─────────────────────────────────────────────────────────────────────────────
# Copy mode (vim-style)
# ─────────────────────────────────────────────────────────────────────────────
setw -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line

# Copy to system clipboard (requires xclip or xsel)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# ─────────────────────────────────────────────────────────────────────────────
# Pane management
# ─────────────────────────────────────────────────────────────────────────────
bind x kill-pane
bind X kill-window
bind z resize-pane -Z  # zoom toggle
bind Space next-layout
bind = select-layout even-horizontal
bind + select-layout even-vertical

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Synchronize panes (type in all panes)
bind Y setw synchronize-panes \; display-message "Sync #{?pane_synchronized,ON,OFF}"

# ─────────────────────────────────────────────────────────────────────────────
# Quick actions
# ─────────────────────────────────────────────────────────────────────────────
bind / copy-mode \; send-keys ?  # search backwards
bind ? list-keys                  # show all keybindings

# ══════════════════════════════════════════════════════════════════════════════
# ONE MONOKAI THEME
# ══════════════════════════════════════════════════════════════════════════════

# Color definitions
MONO_BG="#282c34"
MONO_FG="#abb2bf"
MONO_BLACK="#1e2127"
MONO_RED="#e06c75"
MONO_GREEN="#98c379"
MONO_YELLOW="#e5c07b"
MONO_BLUE="#61afef"
MONO_MAGENTA="#c678dd"
MONO_CYAN="#56b6c2"
MONO_WHITE="#ffffff"
MONO_GRAY="#5c6370"
MONO_LGRAY="#848b98"

# ─────────────────────────────────────────────────────────────────────────────
# Status bar
# ─────────────────────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=$MONO_FG,bg=$MONO_BG"

# Status bar length
set -g status-left-length 100
set -g status-right-length 100

# ─────────────────────────────────────────────────────────────────────────────
# Left status: Session name
# ─────────────────────────────────────────────────────────────────────────────
set -g status-left "\
#[fg=$MONO_BLACK,bg=$MONO_MAGENTA,bold]  #S \
#[fg=$MONO_MAGENTA,bg=$MONO_BG,nobold]"

# ─────────────────────────────────────────────────────────────────────────────
# Window status
# ─────────────────────────────────────────────────────────────────────────────
set -g window-status-separator ""

set -g window-status-format "\
#[fg=$MONO_BG,bg=$MONO_GRAY]\
#[fg=$MONO_FG,bg=$MONO_GRAY] #I #W #F \
#[fg=$MONO_GRAY,bg=$MONO_BG]"

set -g window-status-current-format "\
#[fg=$MONO_BG,bg=$MONO_BLUE]\
#[fg=$MONO_BLACK,bg=$MONO_BLUE,bold] #I #W #F \
#[fg=$MONO_BLUE,bg=$MONO_BG,nobold]"

# ─────────────────────────────────────────────────────────────────────────────
# Right status: System info
# ─────────────────────────────────────────────────────────────────────────────
set -g status-right "\
#[fg=$MONO_GRAY,bg=$MONO_BG]\
#[fg=$MONO_FG,bg=$MONO_GRAY] #{?client_prefix,⌨ ,  }#(whoami) \
#[fg=$MONO_GREEN,bg=$MONO_GRAY]\
#[fg=$MONO_BLACK,bg=$MONO_GREEN]  #H \
#[fg=$MONO_YELLOW,bg=$MONO_GREEN]\
#[fg=$MONO_BLACK,bg=$MONO_YELLOW] %H:%M "

# ─────────────────────────────────────────────────────────────────────────────
# Pane borders
# ─────────────────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=$MONO_GRAY"
set -g pane-active-border-style "fg=$MONO_MAGENTA"

# ─────────────────────────────────────────────────────────────────────────────
# Message style
# ─────────────────────────────────────────────────────────────────────────────
set -g message-style "fg=$MONO_BLACK,bg=$MONO_YELLOW,bold"
set -g message-command-style "fg=$MONO_YELLOW,bg=$MONO_BLACK"

# ─────────────────────────────────────────────────────────────────────────────
# Mode style (copy mode, etc.)
# ─────────────────────────────────────────────────────────────────────────────
set -g mode-style "fg=$MONO_BLACK,bg=$MONO_YELLOW"

# ─────────────────────────────────────────────────────────────────────────────
# Clock
# ─────────────────────────────────────────────────────────────────────────────
setw -g clock-mode-colour "$MONO_BLUE"
setw -g clock-mode-style 24

# ══════════════════════════════════════════════════════════════════════════════
# PLUGINS (via TPM)
# ══════════════════════════════════════════════════════════════════════════════

# TPM path
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# ─────────────────────────────────────────────────────────────────────────────
# Plugin settings
# ─────────────────────────────────────────────────────────────────────────────

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-dir '~/.tmux/resurrect'

# Continuum
set -g @continuum-restore 'off'  # set to 'on' if you want auto-restore
set -g @continuum-save-interval '10'

# Yank
set -g @yank-selection-mouse 'clipboard'

# Initialize TPM (keep at the bottom)
run-shell '~/.tmux/plugins/tpm/tpm'

# ══════════════════════════════════════════════════════════════════════════════
# LOCAL CONFIG
# ══════════════════════════════════════════════════════════════════════════════

# Source local config if exists (machine-specific overrides)
if-shell "[ -f ~/.tmux.local.conf ]" 'source-file ~/.tmux.local.conf'
