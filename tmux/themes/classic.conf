# Classic palette: close to stock tmux with the familiar green bar.
# Adjusted to ensure high contrast across minimal/full and classic presets.
set -g @thm_bg "green"
set -g @thm_fg "black"
set -g @thm_muted "black"
set -g @thm_surface "black"
set -g @thm_session "green"
set -g @thm_window "green"
set -g @thm_active "yellow"
set -g @thm_usage "green"
set -g @thm_netspeed "green"
set -g @thm_host "green"
set -g @thm_time "green"
set -g @thm_alert "red"
set -g @thm_message "yellow"
set -g @thm_clock "black"
set -g @thm_border "black"
