# This is sourced by ~/.tmux.conf before the theme palette is loaded.
# Keep this file focused on user-facing toggles and presets.

# ─────────────────────────────────────────────────────────────────────────────
# CHANGE PREFIX (for servers, use Ctrl+a to not conflict with local Ctrl+Space)
# ─────────────────────────────────────────────────────────────────────────────
# unbind C-Space
# set -g prefix C-a
# bind C-a send-prefix

# ─────────────────────────────────────────────────────────────────────────────
# CHANGE PRESET AND THEME
# ─────────────────────────────────────────────────────────────────────────────
# Theme choices: classic / minimal / monokai / gruvbox / cyberpunk / dracula / darkblue / orange / modren-green / tokyo-light
source-file ~/.tmux/themes/orange.conf

# Presets:
#   classic = nostalgia bare tmux
#   minimal = clean blocks, low-noise UI
#   full    = richer powerline-style layout
set -g @status_preset "minimal"

# Full preset architecture: conic or round
set -g @full_architecture "conic"

# Bar position: top or bottom
set -g @status_position "bottom"

# Segment controls
set -g @show_session "on"
set -g @show_host "on"
set -g @show_prefix_indicator "on"
set -g @show_usage "on"
set -g @show_netspeed "off"
set -g @show_date "off"
set -g @show_seconds "off"

# Suggested combinations:
# set -g @theme_name "tokyo-light"
# set -g @status_preset "full"
# set -g @full_architecture "round"
