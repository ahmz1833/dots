# ------------------------------------------------------------------------------
# CORE MODULES
# ------------------------------------------------------------------------------

[character]
success_symbol = "[❯](st_ok bold)"
error_symbol = "[❯](st_err bold)"
vicmd_symbol = "[❯](purple bold)"

[fill]
symbol = '─'
style = "fg:dark_bg"

[line_break]
disabled = false

[cmd_duration]
min_time = 1
show_milliseconds = true
# Format: (Duration)(Clock Icon)
format = "[](fg:dark_bg)[$duration](fg:text_light bg:dark_bg)[](fg:dark_bg bg:dark_bg)[](fg:bg_duration bg:dark_bg)[󱑂](fg:dark_bg bg:bg_duration)[](fg:bg_duration) "

[status]
disabled = false
# Shows tick/cross. If error > 127 (signal), shows signal name.
# Auto color via $style argument in format isn't fully supported for the whole pill,
# so we use specific symbols and success/error styles on the text.
format = '[](fg:dark_bg)[$symbol$common_meaning$signal_name$maybe_int]($style)[](fg:dark_bg) '
symbol = "✘ "
success_symbol = "✔"
style = "bg:dark_bg fg:st_err" # Error color
success_style = "bg:dark_bg fg:st_ok" # Success color
map_symbol = true

[time]
disabled = false
use_12hr = false
time_format = "%H:%M"
format = "[ $time 󰅐 ](fg:text_light bold)"

[battery]
disabled = false
format = "[$symbol$percentage]($style) "
full_symbol = "󰁹 "
charging_symbol = "󱊥 "
discharging_symbol = "󱊡 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "
[[battery.display]]
threshold = 10
style = "bold bat_critical"
[[battery.display]]
threshold = 30
style = "bold bat_low"
[[battery.display]]
threshold = 99
style = "bold bat_ok"
[[battery.display]]
threshold = 100
style = "bold bat_full"

# Toggle command: starship toggle custom.usage
[custom.usage]
disabled = false
description = "CPU & Memory Usage with Dynamic Colors"
command = "~/.local/bin/checkusage"
format = "[](fg:dark_bg)[$output](bg:dark_bg)[](fg:dark_bg) "
when = "true"
shell = ["bash", "--noprofile", "--norc"]

# ------------------------------------------------------------------------------
# CONTEXT
# ------------------------------------------------------------------------------

[custom.ssh]
description = "Show user@host only in SSH and not in TMUX"
when = '[[ -n "$SSH_CONNECTION" ]] && [[ -z "$TMUX" ]]'
command = 'echo "$USER@$(hostname)"'
format = "[](fg:dark_bg)[$output](bold fg:text_light bg:dark_bg)[](fg:dark_bg bg:dark_bg)[](fg:text_light bg:dark_bg)[󰱠](fg:dark_bg bg:text_light)[](fg:text_light) "
shell = ["bash", "--noprofile", "--norc"]

[os]
disabled = false
format = "$symbol"

[os.symbols]
Alpaquita = "[](fg:os_alpaquita)[](bg:os_alpaquita fg:fullwhite)[](fg:os_alpaquita) "
