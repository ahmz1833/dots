[localip]
disabled = false
ssh_only = false
format = "[](fg:dark_bg)[$localipv4](fg:text_light bg:dark_bg)[](fg:dark_bg bg:dark_bg)[](fg:bg_ip_priv bg:dark_bg)[󰩠](fg:dark_bg bg:bg_ip_priv)[](fg:bg_ip_priv) "

[custom.localip]
disabled = true
description = "Local IP Address (Hides on Disconnect)"
command = "hostname -i | cut -d' ' -f1"
when = "hostname -i | grep -q ."
format = "[](fg:dark_bg)[$output](fg:text_light bg:dark_bg)[](fg:dark_bg bg:dark_bg)[](fg:bg_ip_priv bg:dark_bg)[󰩠](fg:dark_bg bg:bg_ip_priv)[](fg:bg_ip_priv) "
shell = ["sh"]

[custom.publicip]
disabled = true
description = "Public IP Address"
command = "~/.local/bin/checkip"
format = "([](fg:dark_bg)[$output](fg:text_light bg:dark_bg)[](fg:dark_bg bg:dark_bg)[](fg:bg_ip_pub bg:dark_bg)[](fg:dark_bg bg:bg_ip_pub)[](fg:bg_ip_pub) )"
when = "true"

# ------------------------------------------------------------------------------
# DIRECTORY & GIT
# ------------------------------------------------------------------------------

[directory]
truncation_length = 4
truncate_to_repo = true
home_symbol = " "
read_only = " "
format = "[](fg:dark_bg)[$path]($style)[](fg:dark_bg bg:dark_bg)[](fg:bg_dir bg:dark_bg)[$read_only](fg:dark_bg bg:bg_dir)[](fg:bg_dir) "
style = "fg:text_light bg:dark_bg bold"

[git_branch]
symbol = ""
format = "[](fg:bg_git)[$symbol](fg:dark_bg bg:bg_git)[](fg:bg_git bg:dark_bg)[](fg:dark_bg bg:dark_bg)[$branch]($style)[](fg:dark_bg)"
style = "fg:text_light bg:dark_bg"

[git_status]
# Tweaked "Auto Color" for text items (red/yellow/blue)
format = "([](fg:dark_bg)[ $all_status$ahead_behind](bg:dark_bg)[](fg:dark_bg)) "
staged = "[${count} ](fg:git_ok bg:dark_bg)"      # Green
modified = "[${count} ](fg:git_warn bg:dark_bg)"
renamed = "[󰗧${count} ](fg:git_ok bg:dark_bg)"
untracked = "[${count} ](fg:git_alert bg:dark_bg)"
deleted = "[${count} ](fg:git_alert bg:dark_bg)"
conflicted = "[${count} ](fg:git_alert bg:dark_bg)"
stashed = "[${count} ](fg:git_warn bg:dark_bg)"
up_to_date = ""
ahead = "󰞙 ${count} "
behind = "󰞖 ${count} "
diverged = "󰡏 ${ahead_count} ${behind_count} "

[git_commit]
format = "[\\($hash\\)]($style) [\\($tag\\)]($style)"
style = "green"

