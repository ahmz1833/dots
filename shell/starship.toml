# AH MZ 2026 - Starship Prompt Configuration
# Hybrid Configuration: 1amSimp1e Style + Myth Functionality

"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = "hybrid"

# RIGHT SIDE: Public IP -> Duration -> Status
right_format = """$cmd_duration$status${custom.publicip}${custom.usage}"""

# LEFT SIDE: OS -> SSH -> Dir -> Git -> Languages -> Line Break -> Info -> Prompt
format = """
$os\
${custom.ssh}\
$directory\
$git_branch\
$git_status\
$git_commit\
$git_state\
$git_metrics\
$fill \
$docker_context\
$kubernetes\
$package\
$c\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$vlang\
$vagrant\
$zig\
$buf\
$nix_shell\
$conda\
$spack\
$memory_usage\
$env_var\
${localip}\
$battery\
$time\
$sudo\
$line_break\
$jobs\
$shlvl\
$container\
$shell\
$character"""

