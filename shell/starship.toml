# ░▀▀▀░░▀░░▀░▀░▀░▀░▀▀▀░▀░▀░▀▀▀░▀░░
# AH MZ 2026 - Starship Prompt Configuration
# Hybrid Configuration: 1amSimp1e Style + Myth Functionality

"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = "hybrid"

# RIGHT SIDE: Public IP -> Duration -> Status
right_format = """$cmd_duration$status${custom.publicip}${custom.usage}"""

# LEFT SIDE: OS -> SSH -> Dir -> Git -> Languages -> Line Break -> Info -> Prompt
format = """
$os\
${custom.ssh}\
$directory\
$git_branch\
$git_status\
$git_commit\
$git_state\
$git_metrics\
$fill \
$docker_context\
$kubernetes\
$package\
$c\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$vlang\
$vagrant\
$zig\
$buf\
$nix_shell\
$conda\
$spack\
$memory_usage\
$env_var\
${localip}\
$battery\
$time\
$sudo\
$line_break\
$jobs\
$shlvl\
$container\
$shell\
$character"""

[palettes.hybrid]
# --- Base Colors ---
dark_bg         = "#252525"
text_light      = "#E8E3E3"

# --- Tweakable Module Colors (Backgrounds/Accents) ---
bg_dir          = "#6791C9"     # Directory Icon background
bg_git          = "#81C19B"     # Git Branch Icon background
bg_ip_priv      = "#74b5ff"     # Private IP
bg_ip_pub       = "#a074de"     # Public IP
bg_duration     = "#FFEE55"     # Command Duration

# --- Status Colors ---
st_ok           = "#6ae89d"     # Status OK (0)
st_err          = "#f04a50"     # Status Error (non-0)

# --- Battery Colors ---
bat_full        = "#00CCFF"     # 100% Charged
bat_ok          = "#81C19B"     # 30-99%
bat_low         = "#FFA200"     # 10-30%
bat_critical    = "#B66467"     # 0-10%

# --- Git Status Colors ---
git_ok          = "#90deaf"     # Staged/Renamed/Committed
git_warn        = "#FFA200"     # Modified/Stashed
git_alert       = "#f07478"     # Untracked/Deleted/Conflicted

# --- Language Brand Colors ---
# You can tweak these to change the icon color for each language
lang_c = "#555555"
lang_cmake = "#064F8C"
lang_conda = "#8BCB48"
lang_dart = "#00B4AB"
lang_docker = "#2496ED"
lang_dotnet = "#512BD4"
lang_elixir = "#4E2A8E"
lang_elm = "#60B5CC"
lang_go = "#00ADD8"
lang_haskell = "#5E5086"
lang_java = "#B07219"
lang_js = "#F7DF1E"
lang_julia = "#9558B2"
lang_kotlin = "#F18E33"
lang_lua = "#000080"
lang_nim = "#FFE953"
lang_node = "#339933"
lang_perl = "#39457E"
lang_php = "#777BB4"
lang_python = "#3776AB"
lang_ruby = "#CC342D"
lang_rust = "#DEA584"
lang_scala = "#DC322F"
lang_swift = "#F05138"
lang_terraform = "#623CE4"
lang_zig = "#ECA700"
pkg_generic = "#E8E3E3"

# ------------------------------------------------------------------------------
# CORE MODULES
# ------------------------------------------------------------------------------

[character]
success_symbol = "[❯](st_ok bold)"
error_symbol = "[❯](st_err bold)"
vicmd_symbol = "[❯](purple bold)"

[fill]
symbol = '─'
style = "fg:dark_bg"

[line_break]
disabled = false

[cmd_duration]
min_time = 1
show_milliseconds = true
# Format: (Duration)(Clock Icon)
format = "[](fg:dark_bg)[$duration](fg:text_light bg:dark_bg)[](fg:dark_bg bg:dark_bg)[](fg:bg_duration bg:dark_bg)[󱑂](fg:dark_bg bg:bg_duration)[](fg:bg_duration) "

[status]
disabled = false
# Shows tick/cross. If error > 127 (signal), shows signal name.
# Auto color via $style argument in format isn't fully supported for the whole pill, 
# so we use specific symbols and success/error styles on the text.
format = '[](fg:dark_bg)[$symbol$common_meaning$signal_name$maybe_int]($style)[](fg:dark_bg) '
symbol = "✘ "
success_symbol = "✔"
style = "bg:dark_bg fg:st_err" # Error color
success_style = "bg:dark_bg fg:st_ok" # Success color
map_symbol = true

[time]
disabled = false
use_12hr = false
time_format = "%H:%M"
format = "[ $time 󰅐 ](fg:text_light bold)"

[battery]
disabled = false
format = "[$symbol$percentage]($style) "
full_symbol = "󰁹 "
charging_symbol = "󱊥 "
discharging_symbol = "󱊡 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "
[[battery.display]]
threshold = 10
style = "bold bat_critical"
[[battery.display]]
threshold = 30
style = "bold bat_low"
[[battery.display]]
threshold = 99
style = "bold bat_ok"
[[battery.display]]
threshold = 100
style = "bold bat_full"

# Toggle command: starship toggle custom.usage
[custom.usage]
disabled = false
description = "CPU & Memory Usage with Dynamic Colors"
command = "~/.local/bin/checkusage"
format = "[](fg:dark_bg)[$output](bg:dark_bg)[](fg:dark_bg) "
when = "true"
shell = ["bash", "--noprofile", "--norc"]

# ------------------------------------------------------------------------------
# CONTEXT
# ------------------------------------------------------------------------------

[custom.ssh]
description = "Show user@host only in SSH and not in TMUX"
when = '[[ -n "$SSH_CONNECTION" ]] && [[ -z "$TMUX" ]]'
command = 'echo "$USER@$(hostname)"'
format = "[](fg:dark_bg)[$output](bold fg:text_light bg:dark_bg)[](fg:dark_bg bg:dark_bg)[](fg:text_light bg:dark_bg)[󰱠](fg:dark_bg bg:text_light)[](fg:text_light) "
shell = ["bash", "--noprofile", "--norc"]

[os]
disabled = false
format = "$symbol"

[os.symbols]
Alpaquita = "[](fg:#0D597F)[](bg:#0D597F fg:#FFFFFF)[](fg:#0D597F) "
Alpine = "[](fg:#0D597F)[](bg:#0D597F fg:#FFFFFF)[](fg:#0D597F) "
